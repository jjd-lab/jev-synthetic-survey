[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -m "not live_llm" --strict-markers -ra
markers =
    unit: Pure logic tests with no I/O or mocks
    live_llm: Real API calls; skipped by default in CI

# Keep every `markers` entry on ONE line: pytest parses the option as a line list, so an
# indented continuation line registers as a bogus extra marker instead of wrapping.
#
# A CLI `-m` REPLACES the one in `addopts` above, so restate `not live_llm` when passing your
# own selection, otherwise the run quietly starts making real API calls.
#
# `-n auto` (pytest-xdist) is deliberately NOT in addopts: it costs readable output and serial
# tracebacks, and the suite runs in well under a minute, where worker startup would not pay for
# itself.
