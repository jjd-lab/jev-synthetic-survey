[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -m "not live_llm" --strict-markers -ra
markers =
    unit: Pure logic tests with no I/O or mocks
    integration: Multi-module tests with fixtures and mocked LLM
    live_llm: Real API calls; skipped by default in CI
    slow: Scores a real anchor run the shared anchor_scorecard cache does not cover; 14 tests, all in test_hillclimb_report.py. Deselect with -m "not slow and not live_llm" for fast local iteration (measured 2026-09-11: suite ~190s -> 60-85s, that file 191s -> 28s).

# Keep every `markers` entry on ONE line: pytest parses the option as a line list, so an
# indented continuation line registers as a bogus extra marker instead of wrapping.
#
# A CLI `-m` REPLACES the one in `addopts` above, so restate `not live_llm` when deselecting
# `slow` — otherwise the fast run quietly starts making real API calls.
#
# `-n auto` (pytest-xdist) is the other lever, and is deliberately NOT in addopts: it costs
# readable output and serial tracebacks, and CI's run is only ~15s, where worker startup would
# not pay for itself. Measured 2026-09-11 on 8 logical CPUs, full suite 163s -> 80-110s, and
# ~53-63s combined with the selection above. That is ~2x, not ~8x, because the module-scoped
# fixtures (anchor_scorecard, _cache_excel_reads) are rebuilt inside every worker. Worker count
# anywhere from 2 to 8 lands inside this machine's ~35% run-to-run noise -- a repeat of `-n 4`
# went 81s then 109s -- so don't tune it, and don't trust a single timing here.
#
# `slow` membership is a MEASURED property, not a structural one. Sibling tests that also
# touch the anchor run, or also call `_run_main`, are fast because they reuse the cached
# scorecard or abort early. Re-measure with `--durations` rather than inferring membership
# from what a test calls. Not needed in CI: every one of these needs run artifacts under the
# gitignored `outputs/`, so they already skip there.
