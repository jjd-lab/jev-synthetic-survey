<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Social card source</title>
  <!--
    Source for og.png. Re-shoot at exactly 1200x630 after editing, from the repo root:
      "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
        --window-size=1200,630 --hide-scrollbars --virtual-time-budget=8000 \
        --screenshot=site/assets/og.png site/assets/og.html
    Keep the wording in step with og:title, og:description and og:image:alt in index.html.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink-deep: #0b0a08;
      --paper: #f4efe4;
      --jev: #c63b22;
      --gold: #b8860b;
      --serif: "Fraunces", "Iowan Old Style", "Times New Roman", serif;
      --sans: "Sora", "Helvetica Neue", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      width: 1200px;
      height: 630px;
      background: var(--ink-deep);
      color: var(--paper);
      font-family: var(--sans);
      overflow: hidden;
    }
    .card {
      position: absolute;
      inset: 56px 72px;
      border-top: 1px solid color-mix(in srgb, var(--paper) 70%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--paper) 70%, transparent);
      padding-top: 26px;
    }
    .kicker {
      font-family: var(--mono);
      font-size: 17px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
    }
    h1 {
      margin-top: 30px;
      max-width: 820px;
      font-family: var(--serif);
      font-weight: 400;
      font-size: 74px;
      line-height: 1.04;
      letter-spacing: -0.03em;
    }
    .sub {
      margin-top: 22px;
      font-size: 25px;
      color: color-mix(in srgb, var(--paper) 78%, transparent);
    }
    .prices {
      position: absolute;
      left: 0;
      bottom: 28px;
      display: flex;
      align-items: flex-end;
      gap: 34px;
    }
    .price strong {
      display: block;
      font-family: var(--serif);
      font-weight: 400;
      font-size: 82px;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .price span, .vs {
      font-size: 19px;
      color: color-mix(in srgb, var(--paper) 58%, transparent);
    }
    .price span { display: block; margin-top: 8px; }
    .vs { padding-bottom: 46px; }
    .stamp {
      position: absolute;
      right: 34px;
      bottom: 66px;
      width: 214px;
      height: 214px;
      border: 4px solid var(--jev);
      border-radius: 50%;
      display: grid;
      place-content: center;
      text-align: center;
      transform: rotate(-11deg);
      color: var(--jev);
    }
    .stamp span {
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.35;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .stamp strong {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 56px;
      line-height: 1.15;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="kicker">Jev on a synthetic survey</p>
    <h1>How you ask matters more than which model</h1>
    <p class="sub">Jev vs GPT-4.1 · 300 respondents · 24,596 survey answers</p>

    <div class="prices">
      <div class="price"><strong>$4</strong><span>Jev</span></div>
      <div class="vs">vs</div>
      <div class="price"><strong>~$136</strong><span>GPT-4.1</span></div>
    </div>

    <div class="stamp">
      <span>Jev Noul</span>
      <strong>6–0</strong>
      <span>vs GPT-4.1<br>probabilities</span>
    </div>
  </div>
</body>
</html>
