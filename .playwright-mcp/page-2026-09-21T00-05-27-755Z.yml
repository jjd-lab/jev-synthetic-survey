    - generic [ref=f6e354]:
      - generic [ref=f6e355]:
        - paragraph: "05"
        - heading "What this does not say" [level=2] [ref=f6e356]
      - list [ref=f6e357]:
        - listitem [ref=f6e358]: The 300 are the first 300 rows of the panel — older, whiter, more conservative. Read the paired comparisons. Do not read any absolute number as a population estimate.
        - listitem [ref=f6e359]: The holdout is a cognitive-bias battery. Answers are not supposed to track who you are. Individual prediction fails for every arm.
        - listitem [ref=f6e360]:
          - code [ref=f6e361]: Noul
          - text: was built after seeing the result. Option descriptions were pre-registered later and changed nothing.
        - listitem [ref=f6e362]: Jev was given the same plain input gpt-4.1 got. TypeSafe’s own prompting levers are mostly untested, not refuted.
        - listitem [ref=f6e363]:
          - strong [ref=f6e364]: Neither arm should be used for crosstabs.
          - text: "Being right inside a group is not the same as getting the gaps between groups right, and both fail the second one in opposite directions. Jev flattens: it reproduces 40% of the real spread between demographic groups by variable, and 21% by task, dropping to 3–9% on four of the sixteen tasks — a breakdown built on it would read “no demographic effect” where the humans show one. gpt-4.1 exaggerates: 2.87× the real gap on party, 2.68× on political views, reporting a polarization that is not in the data. On the four anchoring columns it gave all 2,058 respondents the same answer, 4,116 cells with no variation at all."
