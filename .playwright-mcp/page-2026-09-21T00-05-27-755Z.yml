        - paragraph: "03"
        - heading "Jev against gpt-4.1" [level=2] [ref=f6e185]
        - paragraph [ref=f6e186]: "Same 300 respondents, same 108 columns, same stateful demographics persona. The test that decides it is a conjunction: Jev must win both the 65 yes/no columns and the 43 ordinal ones. It loses the yes/no half. The second test takes TypeSafe at its word: System One models are “trained for calibrated decisions”, so the bar was set at 0.05. No arm comes close — Jev Noul 0.1472, Jev Choice 0.2029, gpt-4.1 0.2393 — and Jev is the better calibrated of the two models, by 39%, while still sitting three times over the bar. TypeSafe qualifies the claim itself, and the qualification is the finding: “calibration is measured across groups of predictions; it does not guarantee that an individual answer is correct.” Failing for every arm at once is what makes this a statement about demographics-only grounding rather than about Jev."
      - 'figure "Lower is better except accuracy. The hard-answer arm has no vector: its ECE and Brier score a one-hot spike. It is here because it wins accuracy, which is the point about accuracy." [ref=f6e187]':
