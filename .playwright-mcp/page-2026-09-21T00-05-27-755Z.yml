      - paragraph [ref=f6e28]: An evaluation · Twin-2K-500 · jev-1.13.0 vs gpt-4.1
      - heading [level=1] [ref=f6e29]:
        - text: Does a native probability
        - emphasis [ref=f6e30]: beat a verbalized one?
      - paragraph [ref=f6e31]: We asked TypeSafe’s Jev, a decision-only model, and gpt-4.1 to play the same 300 survey respondents. Jev returns a typed value and a probability per option and generates no text at all, so its vector is native rather than written. We asked the chat model to state one in words. Two tests were written down first. Both failed, so the strong claim does not hold. It failed on one of the six measures reported; Jev won the other five, at a thirty-fourth of the cost, and that soft claim is the interesting one.
