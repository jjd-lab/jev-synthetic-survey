        - heading "What a synthetic survey respondent is" [level=2] [ref=f6e56]
        - paragraph [ref=f6e57]: A language model is given a few facts about a real person, walked through questions that person also answered, and scored against those answers. Real panels are slow. A model that could stand in for one would let you pretest a survey. Whether it can is the measurement.
