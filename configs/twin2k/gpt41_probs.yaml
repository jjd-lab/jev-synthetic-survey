# Twin-2K-500 — GPT41_PROBS: chained, but asked for a probability vector — the comparator for the Jev probe
# GENERATED by scripts/twin2k/build_twin2k_variants.py — edit the baseline, then re-run.
#
# The first of three runs on the same 108 questions and same 50 respondents. They vary two
# things, one at a time: what the persona CONTAINS, and whether the model SEES ITS OWN
# earlier answers.
#
#   this file                         14 demographics    doesn't see its own answers
#   ..._prior_answers.yaml            + 620 past Q&A     doesn't see its own answers
#   ..._chained.yaml                  14 demographics    sees its own answers
#
# There is no prior_answers x chained cell: on top of 620 real prior answers the model's own
# earlier answers add near-zero information, and it is by far the slowest path.
#
# The other two are GENERATED from this file and differ from it in nothing but what defines
# their arm: `demographic_mapping`, `memory_mode` and the flags that cancel its side effects,
# `max_concurrency`, and `output_dir` — so edit this one, then re-run
#   python scripts/twin2k/build_twin2k_variants.py
# Editing a generated file by hand silently confounds the comparison it exists for.
#
# Data: LLM-Digital-Twin/Twin-2K-500 (CC BY 4.0) — fetch with
#   python scripts/twin2k/fetch_twin2k.py
# Mappings are generated, never hand-written:
#   python scripts/twin2k/build_twin2k_config.py
#   python scripts/twin2k/build_twin2k_persona.py   (the prior-answer runs)
#
# 108 questions x 50 respondents: the paper's WHOLE holdout instrument, minus the 18 columns
# our decoder cannot read (12 sliders, 6 anchoring/sunk-cost text boxes). 60 are asked of
# everyone; the other 48 are 13 BETWEEN-SUBJECT groups, each asked only of the arm its
# respondent was randomized into (`condition_group`/`condition_arm` in the mapping, gated by
# `QuestionRouter.is_asked`). Asking one twin both arms would convert a between-subject
# manipulation into a within-subject one and erase the effect being measured.
#
# Nothing scored here is persona material in any arm: `build_twin2k_config.py` asserts every
# scored column lies outside the six persona blocks, and `build_twin2k_persona.py` excludes
# that same 126-column set.
#
# The instrument table, the 16-task inventory, the holdout/persona partition and the
# paper-vs-us comparison live in ONE place. Read it before interpreting anything from this
# run, and add to it rather than restating it here:
#   docs/survey/01-dataset-and-instrument.md
#
# FOUR RULES FOR READING THIS RUN'S OUTPUT. Each is a way the numbers mislead if ignored; the
# reasoning and the worked figures are on that page.
#
#   1. REPORT PER TASK, NEVER POOLED. 40 of the 108 columns are one task (pricing), so a
#      pooled average is 37% one experiment. Average within task, then across tasks — which
#      is also how the paper aggregates its 17.
#   2. NEVER READ A PER-RESPONDENT HIT RATE. This arm is demographics-only, which the
#      grounding level supports for AGGREGATE comparisons only.
#   3. READ THE ARM PAIRS SIDE BY SIDE. Per-arm fit is NOT the framing effect and cannot
#      detect a frame-blind twin: one that ignores the frame scores unremarkably against
#      BOTH arms while reproducing none of the effect. No contrast metric is shipped — the
#      export carries each arm's distribution, so the contrast is a few lines in a notebook.
#   4. THE 48 CONDITION COLUMNS SHIP WITHOUT THE COLLAPSE AND BLIND-SPOT GUARDRAILS. At
#      n≈16-25 per arm they sit below `min_n_for_gating`, so `collapse` is forced False and
#      `blind_spot` is None, with `entropy_thin`/`kl_thin` marking why. These per-arm numbers
#      are a PLUMBING PROOF, not a result — grow the panel rather than lowering the floor,
#      which manufactures flags from noise instead of restoring the guardrail.
#
# Two things NOT to "fix": QID198's option labels are literally "1" and "2", so its prompt
# reads "1. 1 / 2. 2" — check the first responses for confusion before trusting that task.
# And QID158 ships with two dataset typos ("nobody people will die", "600 people be die");
# stems are copied verbatim on purpose, because editing one would score the twin on a
# question no human was asked.
#
# The `multi` (Jaccard) bucket is unexercised: the holdout blocks contain no multi-select at
# all. Numbers are NOT comparable to any other survey's result (different instrument and
# population) nor to the paper's own accuracy figures (different metric).

survey:
  name: "Twin-2K-500 Public-Data Validation (smoke)"

  data_source:
    excel_file: "data/twin2k500/wave1_3_response_label.csv"
    demographic_mapping: "configs/twin2k/twin2k_demographic_mapping.json"
    question_mapping: "configs/twin2k/twin2k_question_mapping.json"
    sheet_name: null   # null = first sheet (CSV files don't have sheets)
    max_rows: 50       # smoke run; --sample overrides
    data_format: "text"  # label CSV stores option text, not numeric codes
    preprocess:
      # Renames Twin's `pid` to the `respid` the loader requires, and recovers each
      # respondent's OWN randomized pricing price from the parquet chunks below.
      callable: "src.data.preprocessors.twin2k.preprocess"
      params:
        # Twin's pricing block is Qualtrics piped text: the price is randomized per
        # respondent, so `question_catalog.json` holds one arbitrary draw that only 0.757%
