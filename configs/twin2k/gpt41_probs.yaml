personas:
  source: "excel"
  # No `screener_summarization_prompt`: the summarizer was removed once no arm set it. A
  # persona's prior answers are rendered verbatim as Q:/A: pairs, which is what the
  # prior-answers arm wants and what the demographics arms leave empty. Kept as a note because
  # selects verbatim over summary in `render_history`.

# Shared verbatim by all three arms, so the only difference between them is the persona
# content and the memory mode.
#
# Shape is this repo's own convention, not the dataset's: tagged
# sections ordered stable -> volatile (context, persona, history, current question) so the
# persona stays a cacheable prefix across all 60 questions for a respondent. It is NOT the
# paper's Appendix A.1 wording, which we ran previously; matching a prompt we cannot match
# in elicitation anyway (one call per question, enforced schema, shuffled options, temp 0.7)
# bought nothing, and the tagged shape is what the rest of the repo is tuned for.
#
# {framing_guidance} and {response_format} are NOT available here: no runner supplies them,
# and the placeholders were removed once it was measured that every cell computed and then
# discarded them. The answer format is inlined literally below instead.
#
# "This is a survey research simulation." inside <survey_context> is kept as insurance, but
# on THIS shape it is no longer what carries the prompt past Azure's content filter. Re-probed
# after the rewrite: the same 8 respondents x 2 questions pass 16/16 both with the line and
# with <survey_context> deleted. Under the previous Appendix A.1 wording the same probe failed
# 12 of 16 bare with ContentPolicyViolationError on the INPUT, and deterministically per
# respondent (2-7 failed 100% of attempts, 1 and 8 passed 100%) — so it deleted whole people,
# not a few calls. The trigger was that prompt's identity framing: enumerated race, religion,
# party, political views and citizenship under "answer as if you are the individual
# described". Keep the line; a ~4% residual filter rate was measured with it in place.
#
# <answer_style> exists to close that residual, which is a DIFFERENT failure from the one above:
# `finish_reason=content_filter` on the OUTPUT, not a rejected input. The model writes a long
# scenario-elaborating explanation and Azure truncates the completion mid-flight, so the cell comes
# back `Error`. Resampling clears an output-side rejection often enough that the harness does retry
# it — but not here. Measured: with a 23k-character history, respid 32 / QID189 (Thaler WTA/WTP)
# failed 3/3 and passed 3/3 with this block; it also passes with the history truncated, which is
# what identifies accumulated context as the trigger. The n=50 arms lost 4 cells this way
# (chained 2, prior_answers 2) and the demographics-only arm, which sends no history, lost 0 — so
# the risk scales with the persona and the panel. This constrains the `explanation` field only;
# `choice` is what we score.
survey_prompt: |
  <answer_style>
  Answer analytically. State the choice and at most one short clause of reasoning.
  Do not restate or elaborate the scenario, and do not describe harm, illness, or death.
  </answer_style>

  <survey_context>
  This is a survey research simulation. The Twin-2K-500 study surveyed 2,058 US adults across
  four waves, covering demographic, psychological, economic, personality and cognitive
  measures, replications of behavioral economics experiments, and a pricing survey.
  </survey_context>

  <persona>
  Answer the survey question as the person described below. Before you respond, evaluate which
  of the factors listed would actually affect your answer to this question. Then use that
  information to respond accordingly. Remain consistent with this person's previous answers
  and stated characteristics.

  Demographics:
  - Age: {age}
  - Sex assigned at birth: {sex}
  - Race/Origin: {race}
  - Region: {region}
  - US citizen: {citizen}
  - Education: {education}
  - Employment: {employment}
  - Household income (last year, before taxes): {income}
  - Household size: {household_size}
  - Marital status: {marital}
  - Religion: {religion}
  - Religious attendance: {religious_attendance}
  - Political party: {party}
  - Political views: {political_views}
  </persona>

  <conversation_history>
  {conversation_history}
  </conversation_history>

  <current_question>
  Question: {question}
  Options: {options}

  Return your answer with:
  • choice: Option number(s) you select based on your persona and prior answers
    • explanation: Brief reasoning for this response
  </current_question>

llm:
  # Plain OpenAI model id, for a stock https://api.openai.com/v1 key. Every result shipped
  # in runs/ and reports/ was collected as `azure/gpt-4.1` through a provider instead; the
  # docs keep that name because it is what those numbers came from. Routing is unchanged
  # either way -- `structured_output_method` only branches on a `bedrock/` prefix.
  model: "gpt-4.1"
  persona_temperature: 0.3
  survey_temperature: 0.7
  n_variations: 1
  # The only concurrency knob. A slot holds a whole persona-walk (~82 sequential calls), not a
  # single call, so this is 50 concurrent walks. 50 is this pipeline's proven-stable value;
  # c=100 stalled the provider on the same path.
  max_concurrency: 50

execution:
  save_output: true
  output_dir: "outputs/twin2k/gpt41_probs"

# Respondent-major walk, with chaining switched off. This arm asks one LLM call per
# (persona, question) and never shows the model its own earlier answers, which is what
# defines it; `demographics_stateful` is the same arm with chaining on.
#
# It runs on the walk rather than the batched path because only the walk reaches
# `response_mode`, per-cell option orders and cache pinning. The two flags below cancel
# everything else `full` would otherwise change, so the elicitation is unaffected.
memory_mode: "full"

# Chained, like `demographics_stateful`: the answer entering the history is still the
# model's own `choice`, never a draw from the vector.
chain_own_answers: true

# Grids stay per-member, as the Jev probe asks them. Batched, the 7 grid groups would
# collapse 40 of the 108 columns into 7 calls, and a grid writes ONE combined history turn.
batch_grids: false

# The point of the arm: gpt-4.1 ASKED to state a distribution, against a model whose native
# output is one.
response_mode: "verbalized_probs"

# Prompts are already unique per (persona, question) at n_variations=1, so a UUID
# would only defeat prefix caching.
include_request_id: false

# Reuse the stateful demographics arm's cache so this arm and the Jev probe walk the SAME
# 300 twins; the comparison is about elicitation, not about personas. This is the copy that
# ships in runs/, so a fresh clone reuses it instead of regenerating 300 personas through the
# provider. Omitted, `get_persona_cache_path` derives a path from this arm's own `output_dir`.
persona_cache_path: "runs/gpt41_panel_n2058/demographics_stateful/persona_cache.xlsx"
preserve_anchors: false

# Equal to the default, and stated anyway: this is the floor that suppresses `collapse` and
# `blind_spot` on all 48 condition columns (n≈16-25 per arm), so for THIS survey it is a
# deliberate reporting policy rather than an inherited value — see header rule 4 for why
# lowering it would manufacture flags instead of restoring the guardrail. Other surveys
# state nothing here on purpose and inherit the constant.
min_n_for_gating: 50
